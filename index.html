<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

        <h1>Contact Form</h1>
        <p>Share your details and choose the options that suit you.</p>

        <form id="contactForm">

            <label for="name">Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="you@example.com" required>

            <label for="message">Message</label>
            <textarea id="message" name="message"
                      placeholder="How can we help?" required></textarea>

            <div class="options">
                <label>Courses of interest</label>

                <div class="choice">
                    <label><input type="checkbox" name="course" value="English"> English</label>
                    <label><input type="checkbox" name="course" value="Math"> Math</label>
                    <label><input type="checkbox" name="course" value="Science"> Science</label>
                    <label><input type="checkbox" name="course" value="History"> History</label>
                </div>
            </div>

            <div class="options">
                <label>Gender</label>

                <div class="choice">
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </div>
            </div>

            <label for="country">Country</label>

            <select id="country" name="country" required>
                <option value="">Select a country</option>
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
                <option value="Australia">Australia</option>
            </select>

            <button type="submit">Submit</button>

            <p id="result"></p>

        </form>
    </div>

</body>
</html>
